services:
  frontend:
    image: nayera10/example-frontend
    ports:
      - 5001:5001  

  backend:
    image: nayera10/example-backend
    ports:
      - 8080:8080
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_PASSWORD=postgres
    depends_on:
      - redis
      - db
    restart: unless-stopped
    
  redis:
    image: redis

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=postgres
